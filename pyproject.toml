[project]
name = "internal-mini-course"
version = "0.1.0"
description = "Mini-course: fine-tuning nnU-Net from a pretrained model with a two-phase LR schedule (laptop/CPU runnable)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Keishi Suzuki", email = "keishi.suzuki@mail.utoronto.ca" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "nibabel>=5.1",
    "torch>=2.2",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nbmake>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course_utils"]

# Force the CPU-only PyTorch build on every platform so the acceptance test
# (no GPU, no CUDA) is reproducible on a laptop.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
